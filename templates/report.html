
{% extends "base.html" %}

{% block title %}Report Issue - CityFix{% endblock %}

{% block content %}

<div class="form-container wide">
    <h2>Report a Civic Issue</h2>
    <p>Tell us about the problem in your neighbourhood.</p>

    <form method="POST">

        <label>Issue Title</label>
        <input type="text" name="title"
               placeholder="Example: Large pothole on road" required>

        <label>Category</label>
        <select name="category" required>
            <option value="">Select Category</option>
            <option value="Road Damage">Road Damage</option>
            <option value="Garbage">Garbage</option>
            <option value="Streetlight">Streetlight</option>
            <option value="Water Leakage">Water Leakage</option>
            <option value="Drainage">Drainage</option>
        </select>

        <label>Description</label>
        <textarea name="description" rows="4" required></textarea>

        <label>Ward Number</label>
        <input type="text" name="ward" required>

        <label>Location / Landmark</label>
        <input type="text" name="location"
               placeholder="Near your area landmark" required>

        <label>Latitude (optional)</label>
        <input type="number" step="any" name="latitude">

        <label>Longitude (optional)</label>
        <input type="number" step="any" name="longitude">

        <button type="submit" class="btn">
            Submit Complaint
        </button>

    </form>
</div>

{% endblock %}
